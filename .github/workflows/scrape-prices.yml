name: Scheduled price collection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product ID"
        required: false
      listing_id:
        description: "Optional listing ID"
        required: false

concurrency:
  group: scheduled-price-collection
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_SERVICE_ID: srv-d9b89f5aeets73ai1csg
    steps:
      - name: Trigger Render scrape job
        shell: bash
        run: |
          command="python -m price_monitor.cli scrape --all --trigger scheduled_github"
          if [ -n "${{ github.event.inputs.product_id }}" ]; then
            command="python -m price_monitor.cli scrape --product-id ${{ github.event.inputs.product_id }} --trigger scheduled_github"
          fi
          if [ -n "${{ github.event.inputs.listing_id }}" ]; then
            command="python -m price_monitor.cli scrape --listing-id ${{ github.event.inputs.listing_id }} --trigger scheduled_github"
          fi
          payload=$(jq -n --arg startCommand "$command" '{startCommand: $startCommand}')
          response=$(curl -fsS \
            -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "$response" | jq '(.job // .) | {id: .id, status: .status, startCommand: .startCommand}'
