name: Scheduled price collection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product ID"
        required: false
      listing_id:
        description: "Optional listing ID"
        required: false

concurrency:
  group: scheduled-price-collection
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BASE_URL: https://price-monitor-dashboard.onrender.com
    steps:
      - name: Wake Render service
        shell: bash
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors \
            "${APP_BASE_URL}/_stcore/health"
          echo
          echo "Render service is awake. Internal scheduler will run due price collection."
