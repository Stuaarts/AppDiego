[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-monitor-dashboard"
version = "0.1.0"
description = "Internal Streamlit dashboard for product price monitoring."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lucas Tavares Criscuolo" }]
dependencies = [
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.2",
  "pandas>=2.2",
  "plotly>=5.22",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "streamlit>=1.37",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
price-monitor = "price_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=price_monitor --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
